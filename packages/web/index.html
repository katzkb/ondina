<!doctype html>
<html lang="ja" data-accent="mauve">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ondina</title>
    <script>
      // テーマの既定は OS に合わせる（設計書 3.5）。React が描くまでの間も OS の明暗で描き、ライトの OS で一瞬ダークが出ないようにする
      document.documentElement.dataset.flavor = matchMedia('(prefers-color-scheme: dark)').matches ? 'mocha' : 'latte';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
