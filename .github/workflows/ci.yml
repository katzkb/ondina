name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # typecheck は @ondina/model と @ondina/core の dist/index.d.ts を読むので、その 2 つを先にビルドする
      - run: pnpm -F @ondina/model build
      - run: pnpm -F @ondina/core build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
